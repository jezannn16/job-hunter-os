[project]
name = "job-hunter-os"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
job-hunter = "job_hunter:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: opt-in read-only checks against public services"]

[tool.ruff]
line-length = 120

[tool.setuptools]
py-modules = ["job_hunter"]
